name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Set up Node.js for pinned agnix
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install exact Python development dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Run fail-closed release verification
        run: python scripts/verify.py --profile release --report-dir reports/ci
