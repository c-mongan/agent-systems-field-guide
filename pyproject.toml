[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-systems-field-guide"
version = "0.4.0"
description = "Executable, vendor-neutral guidance for decomposing and evaluating agent systems."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Agent Systems Field Guide contributors" }]
keywords = ["agents", "agent-skills", "evaluation", "architecture", "subagents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
agent-guide = "agent_field_guide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_field_guide = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agent_field_guide"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]


[tool.ruff.lint.per-file-ignores]
"src/agent_field_guide/diagrams.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_field_guide"]
