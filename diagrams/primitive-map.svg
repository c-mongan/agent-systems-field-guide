<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" role="img" aria-labelledby="title desc">
<title id="title">Primitive map</title>
<desc id="desc">Seven architecture primitives grouped by purpose.</desc>
<style>
  .bg{fill:#F7F9FC}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2}
  .h{font:700 26px system-ui,sans-serif;fill:#172033}.t{font:600 17px system-ui,sans-serif;fill:#172033}
  .s{font:400 14px system-ui,sans-serif;fill:#5D6B82}.line{stroke:#5D6B82;stroke-width:2;fill:none}
  .label{font:700 12px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
  @media(prefers-color-scheme:dark){.bg{fill:#0B1020}.card{fill:#141B2D;stroke:#344155}.h,.t{fill:#F2F5FA}.s{fill:#AAB6CA}.line{stroke:#8391A8}}
</style>
<rect class="bg" width="100%" height="100%" rx="24"/>
<text class="h" x="50" y="56">What are you adding?</text><rect class="card" x="50" y="95" width="220" height="88" rx="18"/>
<rect x="50" y="95" width="8" height="88" rx="4" fill="#3B82F6"/>
<text class="t" x="74" y="131">Always-needed rule</text>
<text class="s" x="74" y="157">Instructions</text><rect class="card" x="310" y="95" width="220" height="88" rx="18"/>
<rect x="310" y="95" width="8" height="88" rx="4" fill="#0F9D8A"/>
<text class="t" x="334" y="131">Reusable procedure</text>
<text class="s" x="334" y="157">Skill</text><rect class="card" x="570" y="95" width="220" height="88" rx="18"/>
<rect x="570" y="95" width="8" height="88" rx="4" fill="#7C3AED"/>
<text class="t" x="594" y="131">Optional knowledge</text>
<text class="s" x="594" y="157">Reference</text><rect class="card" x="830" y="95" width="220" height="88" rx="18"/>
<rect x="830" y="95" width="8" height="88" rx="4" fill="#D97706"/>
<text class="t" x="854" y="131">Exact operation</text>
<text class="s" x="854" y="157">Script or tool</text><rect class="card" x="180" y="235" width="220" height="88" rx="18"/>
<rect x="180" y="235" width="8" height="88" rx="4" fill="#DC4C64"/>
<text class="t" x="204" y="271">External boundary</text>
<text class="s" x="204" y="297">MCP</text><rect class="card" x="440" y="235" width="220" height="88" rx="18"/>
<rect x="440" y="235" width="8" height="88" rx="4" fill="#3B82F6"/>
<text class="t" x="464" y="271">Required control flow</text>
<text class="s" x="464" y="297">Workflow</text><rect class="card" x="700" y="235" width="220" height="88" rx="18"/>
<rect x="700" y="235" width="8" height="88" rx="4" fill="#7C3AED"/>
<text class="t" x="724" y="271">Separate context</text>
<text class="s" x="724" y="297">Subagent / agent</text>
</svg>
