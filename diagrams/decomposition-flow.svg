<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="270" viewBox="0 0 1120 270" role="img" aria-labelledby="title desc">
<title id="title">Decomposition flow</title>
<desc id="desc">A measured symptom leads to a boundary and proof.</desc>
<style>
  .bg{fill:#F7F9FC}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2}
  .h{font:700 26px system-ui,sans-serif;fill:#172033}.t{font:600 17px system-ui,sans-serif;fill:#172033}
  .s{font:400 14px system-ui,sans-serif;fill:#5D6B82}.line{stroke:#5D6B82;stroke-width:2;fill:none}
  .label{font:700 12px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
  @media(prefers-color-scheme:dark){.bg{fill:#0B1020}.card{fill:#141B2D;stroke:#344155}.h,.t{fill:#F2F5FA}.s{fill:#AAB6CA}.line{stroke:#8391A8}}
</style>
<rect class="bg" width="100%" height="100%" rx="24"/>
<text class="h" x="50" y="54">Decompose by failure, not file size</text><rect class="card" x="70" y="100" width="260" height="104" rx="18"/>
<rect x="70" y="100" width="8" height="104" rx="4" fill="#DC4C64"/>
<text class="t" x="94" y="136">Symptom</text>
<text class="s" x="94" y="162">Wrong route, excess context, repeated mechanics, or polluted reasoning</text><path class="line" d="M330 152 L430 152"/><path d="M422 147 L430 152 L422 157" fill="none" stroke="#5D6B82" stroke-width="2"/><rect class="card" x="430" y="100" width="260" height="104" rx="18"/>
<rect x="430" y="100" width="8" height="104" rx="4" fill="#0F9D8A"/>
<text class="t" x="454" y="136">Boundary</text>
<text class="s" x="454" y="162">Reference, script, workflow, or isolated worker</text><path class="line" d="M690 152 L790 152"/><path d="M782 147 L790 152 L782 157" fill="none" stroke="#5D6B82" stroke-width="2"/><rect class="card" x="790" y="100" width="260" height="104" rx="18"/>
<rect x="790" y="100" width="8" height="104" rx="4" fill="#3B82F6"/>
<text class="t" x="814" y="136">Proof</text>
<text class="s" x="814" y="162">Paired success, latency, token, and trace evidence</text>
</svg>
